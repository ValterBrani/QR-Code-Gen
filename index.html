<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>QR Code Generator</h1>
      <p>Configure your options and generate a personalized QR code.</p>

      <form id="qrForm">
        <div class="form-group">
          <label for="qrType">QR Type</label>
          <select id="qrType">
            <option value="text" selected>Text / URL</option>
            <option value="wifi">Wi-Fi</option>
            <option value="vcard">vCard (Contact)</option>
          </select>
        </div>

        <!-- Text / URL -->
        <div class="form-group" id="textFields">
          <label for="qrText">Text / URL <span class="required">*</span></label>
          <textarea id="qrText" rows="4" placeholder="https://example.com" required></textarea>
        </div>

        <!-- Wi-Fi -->
        <div id="wifiFields" hidden>
          <div class="form-group">
            <label for="wifiSsid">Network Name (SSID) <span class="required">*</span></label>
            <input type="text" id="wifiSsid" placeholder="MyWiFi" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="wifiSecurity">Security</label>
              <select id="wifiSecurity">
                <option value="WPA" selected>WPA/WPA2/WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass">Open (No password)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="wifiPassword">Password</label>
              <input type="text" id="wifiPassword" placeholder="********" />
            </div>
          </div>

          <div class="form-group checkbox-group">
            <label for="wifiHidden" class="checkbox-label">
              <input type="checkbox" id="wifiHidden" /> Hidden network
            </label>
          </div>
        </div>

        <!-- vCard -->
        <div id="vcardFields" hidden>
          <div class="form-row">
            <div class="form-group">
              <label for="vcardFirstName">First Name <span class="required">*</span></label>
              <input type="text" id="vcardFirstName" placeholder="John" />
            </div>

            <div class="form-group">
              <label for="vcardLastName">Last Name <span class="required">*</span></label>
              <input type="text" id="vcardLastName" placeholder="Doe" />
            </div>
          </div>

          <div class="form-group">
            <label for="vcardOrganization">Organization</label>
            <input type="text" id="vcardOrganization" placeholder="My Company" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="vcardEmail">Email</label>
              <input type="email" id="vcardEmail" placeholder="john@example.com" />
            </div>

            <div class="form-group">
              <label for="vcardPhone">Phone</label>
              <input type="tel" id="vcardPhone" placeholder="+1234567890" />
            </div>
          </div>

          <div class="form-group">
            <label for="vcardWebsite">Website</label>
            <input type="url" id="vcardWebsite" placeholder="https://example.com" />
          </div>
        </div>

        <!-- Options -->
        <div class="options-toggle">
          <button type="button" id="toggleOptions" class="toggle-btn">▼ Show Options</button>
        </div>
        <fieldset id="optionsFieldset" class="hidden">
          <legend>Options</legend>

          <div class="form-row">
            <div class="form-group">
              <label for="qrSize">Size</label>
              <select id="qrSize">
                <option value="200">Small (200px)</option>
                <option value="300" selected>Medium (300px)</option>
                <option value="400">Large (400px)</option>
                <option value="500">Extra Large (500px)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="qrLevel">Error Correction</label>
              <select id="qrLevel">
                <option value="L">L (7%)</option>
                <option value="M" selected>M (15%)</option>
                <option value="Q">Q (25%)</option>
                <option value="H">H (30%)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="qrFgColor">Foreground Color</label>
              <input type="color" id="qrFgColor" value="#000000" />
            </div>

            <div class="form-group">
              <label for="qrBgColor">Background Color</label>
              <input type="color" id="qrBgColor" value="#ffffff" />
            </div>
          </div>

          <div class="form-group">
            <label for="downloadFormat">Download Format</label>
            <select id="downloadFormat">
              <option value="png" selected>PNG</option>
              <option value="jpg">JPG</option>
              <option value="svg">SVG</option>
            </select>
          </div>
        </fieldset>

        <div class="actions">
          <button type="button" id="generateBtn">Generate</button>
          <button type="button" id="downloadBtn" disabled>Download</button>
          <button type="reset" id="resetBtn">Reset</button>
        </div>
      </form>

      <section class="result">
        <div id="qrcode" aria-label="QR Code Result"></div>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
