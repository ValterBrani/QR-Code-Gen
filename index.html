<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générateur QR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Générateur de QR Code</h1>
      <p>Entre un texte ou une URL, puis clique sur <strong>Générer</strong>.</p>

      <label for="qrText">Texte / URL</label>
      <textarea id="qrText" rows="4" placeholder="https://example.com"></textarea>

      <div class="actions">
        <button id="generateBtn">Générer</button>
        <button id="downloadBtn" disabled>Télécharger PNG</button>
      </div>

      <section class="result">
        <div id="qrcode" aria-label="Résultat QR code"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
